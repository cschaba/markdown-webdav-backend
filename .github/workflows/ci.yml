name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release runs the same checks before it builds anything

permissions:
  contents: read

# Actions are pinned to a commit, like the scripts the pages load: a tag can be
# moved to other code, a hash cannot.
jobs:
  go:
    name: Go build, vet, format, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # internal/gitlog commits for real; without an identity git refuses
      - name: A git identity for the tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n $unformatted ]]; then
            echo "not formatted with gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go test ./...

  browser:
    name: Checks in a real browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # The scripts refuse to run without their tools rather than skip, so a
      # runner image that loses Chrome turns this job red, not green.
      - name: Tools the checks need
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q poppler-utils
          google-chrome --version
      - name: Keyboard, slides, export settings, Content-Security-Policy
        run: tools/check-browser.sh
      - name: PDF export
        run: |
          go build
          tools/check-pdf-export.sh
