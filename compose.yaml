# Example deployment. Put a TLS-terminating reverse proxy in front of it:
# basic auth sends the password with every request.
services:
  vault:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MDWEBDAV_USER: vault
      MDWEBDAV_PASSWORD_FILE: /run/secrets/vault_password
    secrets:
      - vault_password
    volumes:
      - ./vault:/vault

secrets:
  vault_password:
    file: ./vault_password.txt
